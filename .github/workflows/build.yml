name: Build DiceVox

# Builds the VST3 for Windows and macOS on every push and runs the offline tests.
#  - Every run (any branch): builds the release zips and checks them (package job),
#    so a feature branch gets a full packaging dry run without publishing anything.
#  - Push to main      -> refreshes the "Latest build" release on the repo's main page
#  - Push a tag v0.2.0 -> creates a permanent "v0.2.0" release
#  - Push to a claude/* branch -> build + tests + installer only (nothing published)
# Every zip contains DiceVox.vst3/ at its root plus licenses/ with the SIL OFL texts
# of the fonts embedded in the plug-in (Issue #4). Windows also gets DiceVox-Setup.exe,
# a one-click installer (installer/DiceVox.iss).
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            extra_config: ""
          - name: macOS
            os: macos-latest
            extra_config: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra_config }}

      - name: Build plugin + tests
        shell: bash
        run: cmake --build build --config Release --parallel --target DiceVox_VST3 DiceVox_Standalone DiceVoxTests

      - name: Run offline tests
        shell: bash
        run: |
          if [ -f build/Release/DiceVoxTests.exe ]; then build/Release/DiceVoxTests.exe; else build/DiceVoxTests; fi

      - name: Stage package (DiceVox.vst3 + font licences)
        shell: bash
        run: tools/packaging/stage-package.sh build/DiceVox_artefacts/Release/VST3 package

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DiceVox-${{ matrix.name }}-VST3
          # Same layout as the release zip: DiceVox.vst3/ (ready to drop into
          # C:\Program Files\Common Files\VST3) + licenses/ (font licence texts).
          path: package/

      - name: Build Windows installer (DiceVox-Setup.exe)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(DiceVox VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & $iscc /Qp "/DSourceDir=$PWD\package" "/DAppVersion=$version" "/DOutputDir=$PWD\installer-out" installer\DiceVox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item installer-out\DiceVox-Setup.exe | Format-List Name, Length

      - name: Upload Windows installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DiceVox-Windows-Installer
          path: installer-out/DiceVox-Setup.exe

  package:
    # Builds the exact zips a release would publish and checks them. Runs on every
    # branch (a dry run off main); the release job only publishes zips that passed.
    name: Package + check release zips
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip plugins (DiceVox.vst3/ + licenses/ at the top of each zip)
        shell: bash
        run: |
          # Artifact downloads drop file permissions; restore the Mac binary's execute bit.
          chmod +x dist/DiceVox-macOS-VST3/DiceVox.vst3/Contents/MacOS/* || true
          mkdir -p release
          for os in Windows macOS; do
            (cd "dist/DiceVox-$os-VST3" && zip -qr "$GITHUB_WORKSPACE/release/DiceVox-$os.zip" DiceVox.vst3 licenses)
          done
          # One-click updater for Windows (download once; it updates DiceVox from then on)
          (cd tools/updater && zip -q "$GITHUB_WORKSPACE/release/AHE-Updater-Windows.zip" Update-DiceVox.cmd Update-DiceVox.ps1)
          # One-click installer for Windows
          cp dist/DiceVox-Windows-Installer/DiceVox-Setup.exe release/
          ls -l release

      - name: Check packages (layout, binaries, unmodified OFL notices, no raw fonts)
        shell: bash
        run: |
          tools/packaging/test-check-package.sh
          python3 tools/packaging/check-package.py release/DiceVox-Windows.zip --platform windows
          python3 tools/packaging/check-package.py release/DiceVox-macOS.zip --platform macos

      - name: Upload release zips (checked)
        uses: actions/upload-artifact@v4
        with:
          name: DiceVox-release-zips
          path: release/

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DiceVox-release-zips

      - name: Publish
        shell: bash
        run: |
          NOTES="Built from commit ${GITHUB_SHA::7}.

          **Install (Windows, one click):** download DiceVox-Setup.exe and run it, then in FL Studio use
          Options > Manage plugins > Find installed plugins. Windows may warn that the installer is unsigned:
          click More info > Run anyway.

          **Auto-updates (Windows):** download AHE-Updater-Windows.zip once, unzip it, and double-click Update-DiceVox.cmd.
          It installs DiceVox and puts an 'Update DiceVox' shortcut on your desktop for future updates.

          **Install (Windows):** unzip DiceVox-Windows.zip, copy the DiceVox.vst3 folder into
          C:\Program Files\Common Files\VST3, then in FL Studio use Options > Manage plugins > Find more plugins.

          **Install (Mac):** unzip DiceVox-macOS.zip and copy DiceVox.vst3 into ~/Library/Audio/Plug-Ins/VST3.
          This build is unsigned, so macOS may block it the first time.

          **Licences:** DiceVox embeds the Inter and Barlow Condensed fonts (SIL Open Font License 1.1).
          Their licence texts are in the licenses/ folder of each DiceVox zip."

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" DiceVox-*.zip DiceVox-Setup.exe AHE-Updater-Windows.zip -R "$GITHUB_REPOSITORY" \
              --title "DiceVox $GITHUB_REF_NAME" --notes "$NOTES" --latest
          else
            gh release delete latest-build -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            gh release create latest-build DiceVox-*.zip DiceVox-Setup.exe AHE-Updater-Windows.zip -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Latest build" --notes "$NOTES" --latest
          fi

  test-updater:
    # Runs the updater against the release that was just published, on a real
    # Windows machine with the built-in Windows PowerShell 5.1.
    name: Test updater (Windows PowerShell 5.1)
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run updater tests
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/updater/Test-Updater.ps1
          exit $LASTEXITCODE
